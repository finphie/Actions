name: Build(YAML)

on:
  workflow_call:
  pull_request:
    paths:
      - '**/*.yml'

permissions: {}

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: yamllint .
