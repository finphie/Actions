name: Build(YAML)

on:
  workflow_call:
  pull_request:
    paths:
      - '**/*.yml'

permissions: {}

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: yamllint .
