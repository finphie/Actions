name: Release

on:
  workflow_call:
    inputs:
      version:
        description: バージョンを表す文字列。
        required: true
        type: string
      tag:
        description: gitタグ名。
        required: true
        type: string

permissions: {}

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download artifacts
        id: download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}

      - name: Check extension
        id: check-extension
        uses: finphie/Actions/.github/actions/check-extension@main
        with:
          path: ${{ steps.download-artifact.outputs.download-path }}
          recurse: true

      - name: Generate artifact attestation
        if: steps.check-extension.outputs.zip == 'true' ||
          steps.check-extension.outputs.exe == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ steps.download-artifact.outputs.download-path }}/**/*.zip
            ${{ steps.download-artifact.outputs.download-path }}/**/*.tar.gz
            ${{ steps.download-artifact.outputs.download-path }}/**/*.exe

      - name: Create release
        uses: finphie/Actions/.github/actions/create-release@main
        with:
          title: Version ${{ inputs.version }}
          tag: ${{ inputs.tag }}
          files: |
            ${{ steps.download-artifact.outputs.download-path }}/**/*.zip
            ${{ steps.download-artifact.outputs.download-path }}/**/*.tar.gz
            ${{ steps.download-artifact.outputs.download-path }}/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
