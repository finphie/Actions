name: Get GitHub repositories
description: GitHubリポジトリ名を取得するアクションです。

inputs:
  source:
    description: フォークではないリポジトリを取得する。forkと同時に有効にはできない。
    required: false
    default: 'false'
  fork:
    description: フォークしたリポジトリを取得する。sourceと同時に有効にはできない。
    required: false
    default: 'false'
  archived:
    description: アーカイブされたリポジトリを取得する。no-archivedと同時に有効にはできない。
    required: false
    default: 'false'
  no-archived:
    description: アーカイブされていないリポジトリを取得する。archivedと同時に有効にはできない。
    required: false
    default: 'false'
  visibility:
    description: 指定された可視性（public/private/internal）のリポジトリを取得する。
    required: false
    default: public
  language:
    description: 指定された言語が主要なリポジトリを取得する。
    required: false
    default: ''
  exclude:
    description: 除外する「オーナー名/リポジトリ名」形式のリスト。
    required: false
    default: ''
  json:
    description: JSON形式で出力するかどうか。
    required: false
    default: 'false'

outputs:
  repositories:
    description: 「オーナー名/リポジトリ名」のリスト。
    value: ${{ steps.x.outputs.repositories }}

runs:
  using: composite
  steps:
    - name: Get GitHub repositories
      id: x
      shell: pwsh
      env:
        SOURCE: ${{ inputs.source }}
        FORK: ${{ inputs.fork }}
        ARCHIVED: ${{ inputs.archived }}
        NO_ARCHIVED: ${{ inputs.no-archived }}
        VISIBILITY: ${{ inputs.visibility }}
        LANGUAGE: ${{ inputs.language }}
        EXCLUDE: ${{ inputs.exclude }}
        JSON: ${{ inputs.json }}
      run: |
        $parameters = @{
          Source = $Env:SOURCE -eq 'true'
          Fork = $Env:FORK -eq 'true'
          Archived = $Env:ARCHIVED -eq 'true'
          NoArchived = $Env:NO_ARCHIVED -eq 'true'
          Visibility = $Env:VISIBILITY
          Language = $Env:LANGUAGE
          Exclude = $Env:EXCLUDE
          Json = $Env:JSON -eq 'true'
        }
        ${{ github.action_path }}/GetGitHubRepositories.ps1 @parameters -Verbose -ErrorAction Stop
