name: Get .NET projects
description: .NETプロジェクトの情報を取得するアクションです。

inputs:
  solution-name:
    description: ソリューション名。
    required: false
    default: ${{ github.event.repository.name }}
  projects:
    description: 「プロジェクト名,プラットフォーム名」区切りのリスト。
    required: true
  settings-file-path:
    description: 設定ファイルのパス。
    required: false
    default: default.json

outputs:
  projects:
    description: upload-artifacts-dotnet.ymlワークフローの引数となるJSON文字列を出力する。
    value: ${{ steps.x.outputs.projects }}

runs:
  using: composite
  steps:
    - name: Get .NET projects
      id: x
      shell: pwsh
      env:
        SOLUTION_NAME: ${{ inputs.solution-name }}
        PROJECTS: ${{ inputs.projects }}
        SETTINGS_FILE_PATH: ${{ inputs.settings-file-path != '' && inputs.settings-file-path || format('{0}/{1}', github.action_path, (github.repository_owner == 'finphie' && 'finphie.json' || 'default.json')) }}
      run: |
        $parameters = @{ 
          SolutionName = $Env:SOLUTION_NAME
          Projects = $Env:PROJECTS
          SettingsFilePath = $Env:SETTINGS_FILE_PATH
        }
        ${{ github.action_path }}/GetDotNetProjects.ps1 @parameters -Verbose -ErrorAction Stop
