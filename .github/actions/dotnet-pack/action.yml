name: .NET Pack
description: dotnet packコマンドを実行するアクションです。

inputs:
  dotnet-version:
    description: インストールする.NET SDKバージョン。
    required: false
    default: 11.0.100-preview.3.26207.106
  configuration:
    description: ビルド構成。
    required: false
    default: Release
  version:
    description: バージョンを表す文字列。
    required: true
  output-directory:
    description: 出力先ディレクトリ。
    required: false
    default: pack

outputs:
  success:
    description: nupkgファイルの生成に成功したかどうか。
    value: ${{ steps.check-extension.outputs.nuget }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Pack
      shell: pwsh
      env:
        DOTNET_NOLOGO: true
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
        DOTNET_CLI_TELEMETRY_OPTOUT: true
        CONFIGURATION: ${{ inputs.configuration }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        VERSION: ${{ inputs.version }}
      run: |
        dotnet pack `
            --configuration $Env:CONFIGURATION `
            --output $Env:OUTPUT_DIRECTORY `
            -p:Version=$Env:VERSION

    - name: Check extension
      id: check-extension
      uses: finphie/Actions/.github/actions/check-extension@main
      with:
        path: ${{ inputs.output-directory }}
