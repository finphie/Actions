name: Read file
description: テキストファイルを読み込むアクションです。

inputs:
  file-path:
    description: テキストファイルのパス。
    required: true

outputs:
  text:
    description: ファイル内容。
    value: ${{ steps.x.outputs.text }}

runs:
  using: composite
  steps:
    - name: Read file
      id: x
      shell: pwsh
      env:
        FILE_PATH: ${{ inputs.file-path }}
      run: |
        $parameters = @{
          FilePath = $Env:FILE_PATH
        }
        ${{ github.action_path }}/ReadFile.ps1 @parameters -Verbose -ErrorAction Stop
