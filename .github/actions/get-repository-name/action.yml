name: Get repository name
description: リポジトリ名を取得するアクションです。

inputs:
  repository:
    description: owner/repoまたはrepo形式のリポジトリ名。
    required: true

outputs:
  repository-name:
    description: リポジトリ名。
    value: ${{ steps.x.outputs.repository-name }}

runs:
  using: composite
  steps:
    - name: Get repository name
      id: x
      shell: pwsh
      env:
        REPOSITORY: ${{ inputs.repository }}
      run: |
        $parameters = @{ 
          Repository = $Env:REPOSITORY
        }
        ${{ github.action_path }}/GetRepositoryName.ps1 @parameters -Verbose -ErrorAction Stop
